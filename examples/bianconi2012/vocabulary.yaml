# Vocabulary for the first library, built from BIOMD0000000427 alone.
# No identifiers: in this model the active and inactive forms share one UniProt id, and RafPP is annotated as Raf,
# so annotation matching (spec section 6, step 2) would map Raf_active and RafPP to Raf. Species match by name instead.
# Unit: the model declares none; values are molecule counts per cell. The cell compartment has size 1, so they are
# written item/litre with overrides.yaml giving volume = litre, and every conversion factor is 1.

