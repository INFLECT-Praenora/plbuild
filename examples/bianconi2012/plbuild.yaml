# First process library: BIOMD0000000427 (Bianconi 2012, EGFR and IGF1R pathway), used by EnsGen as both the
# library source and the ground-truth patient (PI decision, 2026-11-23).
vocabulary: vocabulary.yaml
overrides: overrides.yaml
cache: .plbuild-cache
output: out

library:
  time_unit: minute        # the model declares no units; library units = source units for this test
  size: 25                 # PI, 2026-11-23: draw 25 entries from the 22 curated processes + 16 templates
  seed: 4                  # fixes the draw; seed 4 leaves out 9 curated processes, all replaceable by drawn templates

bounds:
  factor: 100                  # curated parameters: source value / 100 to source value * 100
  templates: [1.0e-6, 1.0e7]   # template parameters (Hill coefficients stay 1 to 4). The EnsGen spec's 1e-3..1e3 is
                               # too narrow here: 427's Michaelis constants reach ~1e6 because species are molecule counts

compartments:
  cell:
    identifiers: [http://identifiers.org/bto/BTO:0002058]
    synonyms: [cell_nsclc]

models:
  - id: BIOMD0000000427
    default_compartment: cell
    sbml: BIOMD0000000427.xml   # local copy until `plbuild fetch` exists (L1)
    time_span: 2000             # long enough for the pathway to return to rest
