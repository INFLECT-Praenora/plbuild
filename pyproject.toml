[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plbuild"
version = "0.0.1"
description = "Builds the EnsGen process library from BioModels SBML models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "requests>=2.28",
    "sympy>=1.12",
    "pint>=0.23",
    "python-libsbml>=5.20",
    "antimony>=2.14",
    "libroadrunner>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
plbuild = "plbuild.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
